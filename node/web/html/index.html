<h1>这个二进制没有内置前端</h1>
<p>它是 <code>sui-agent</code>，用于把节点接入 s-ui Cloud 控制面，不是完整的 s-ui 面板。</p>
<p>节点上用：<code>sui-agent agent --panel &lt;控制面地址&gt; --token &lt;节点令牌&gt;</code></p>
<p>如果确实需要 Web 面板，请先构建前端再打包（见仓库 README 的「节点」一节）。</p>
