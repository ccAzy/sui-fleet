name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  panel:
    name: 面板（Worker 类型检查 + 打包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
        working-directory: panel
      - run: npx tsc --noEmit
        working-directory: panel
      - name: 单元测试（链接 → Clash / sing-box 配置）
        run: npm run test:unit
        working-directory: panel
      - name: wrangler 打包（不部署）
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: panel

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  node:
    name: 节点（Go 构建 linux/amd64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: 构建 sui-agent
        working-directory: node
        env:
          CGO_ENABLED: "1"
        run: |
          # 标签串太长，拆成两行拼：单行版超过 80 列，CI 的 markdown/yaml 行宽检查会拦
          TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,"
          TAGS="${TAGS}badlinkname,tfogo_checklinkname0,with_tailscale"
          go build -tags "$TAGS" \
            -ldflags '-w -s -checklinkname=0' \
            -o /tmp/sui-agent .
          ls -lh /tmp/sui-agent
