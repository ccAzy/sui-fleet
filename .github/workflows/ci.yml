name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 静态检查（biome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # 只卡 error：warning 目前还有几百条（历史存量），慢慢收，不要一上来就红一片
      - run: npx biome check . --diagnostic-level=error
  panel:
    name: 面板（Worker 类型检查 + 打包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x 要求 Node >=22，20 会直接拒绝执行（dry-run 也拒）
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
        working-directory: panel
      - run: npx tsc --noEmit
        working-directory: panel
      - name: 单元测试（链接 → Clash / sing-box 配置）
        run: npm run test:unit
        working-directory: panel
      - name: wrangler 打包（不部署）
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: panel

  node:
    name: 节点 agent（Go 构建 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      # 以前这里只 build 不 test：agent_test.go 写了也从来没跑过，
      # 「clients 变更必须重启内核」那条回归正是因此漏掉的。
      # 覆盖范围：从 ./cmd 扩到 ./util ./database ./core/...
      # 为什么不写成 ./...：本机实测有两个包构建不过，原因同一个 ——
      #   sing-box 的 transport/v2rayhttp 用 //go:linkname 指向
      #   golang.org/x/net/http2.(*Transport).connPool，该字段在 x/net 的某些版本里不存在，
      #   链接期报 undefined reference。cmd 与 sub 都会把这条依赖链拉进来。
      #   这是真实的依赖耦合问题，要单独修（pin x/net 或跟上游版本），不能靠"CI 别测"掩盖；
      #   但也不能因此让整个 CI 一直只跑 ./cmd 那 7 个测试。
      - name: 单元测试
        run: go test ./util ./database ./core/... -count=1
        working-directory: node
      - name: 构建 sui-agent
        working-directory: node
        env:
          CGO_ENABLED: "1"
        run: |
          # 标签串太长，拆两行拼：单行版超过 80 列，yaml 行宽检查会拦
          TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,"
          TAGS="${TAGS}badlinkname,tfogo_checklinkname0,with_tailscale"
          LD="-w -s -checklinkname=0"
          go build -tags "$TAGS" -ldflags "$LD" -o /tmp/sui-agent .
          ls -lh /tmp/sui-agent

  selfhost:
    name: 自托管壳（类型检查 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: apps/selfhost
      # selfhost 的 tsconfig 直接 include 了 panel/src（业务代码共用一份），
      # 而那份代码 import 'hono' —— 模块解析从 panel/src 往上找 node_modules，
      # 只装 apps/selfhost 的依赖是找不到的。CI 上必须把 panel 的依赖也装上。
      - run: npm install --no-audit --no-fund
        working-directory: panel
      - run: npm run typecheck
        working-directory: apps/selfhost
      - run: npm test
        working-directory: apps/selfhost

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: 校验已提交的 panel/frontend-dist 与源码一致
        # 仓库里提交了构建产物（Deploy 按钮要求子目录自包含），所以必须防止
        # 「改了 frontend/src 忘了重建产物 → CI 全绿、线上还是旧 UI」。
        run: |
          bash panel/build-frontend.sh
          if ! git diff --exit-code -- panel/frontend-dist; then
            echo "panel/frontend-dist 与源码不一致"
            echo "请在本地跑 bash panel/build-frontend.sh 后一并提交"
            exit 1
          fi

  arbiter:
    name: 仲裁者（单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: apps/arbiter
      - run: npm run typecheck
        working-directory: apps/arbiter
      - run: npm test
        working-directory: apps/arbiter
