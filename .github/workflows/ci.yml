name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  panel:
    name: 面板（Worker 类型检查 + 打包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
        working-directory: panel
      - run: npx tsc --noEmit
        working-directory: panel
      - name: 单元测试（链接 → Clash / sing-box 配置）
        run: npm run test:unit
        working-directory: panel
      - name: wrangler 打包（不部署）
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: panel

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: 校验已提交的 panel/frontend-dist 与源码一致
        # 仓库里提交了构建产物（Deploy 按钮要求子目录自包含），所以必须防止
        # 「改了 frontend/src 忘了重建产物 → CI 全绿、线上还是旧 UI」。
        run: |
          bash panel/build-frontend.sh
          if ! git diff --exit-code -- panel/frontend-dist; then
            echo "panel/frontend-dist 与源码不一致"
            echo "请在本地跑 bash panel/build-frontend.sh 后一并提交"
            exit 1
          fi

  node:
    name: 节点（Go 构建 linux/amd64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: 构建 sui-agent
        working-directory: node
        env:
          CGO_ENABLED: "1"
        run: |
          # 标签串太长，拆成两行拼：单行版超过 80 列，CI 的 markdown/yaml 行宽检查会拦
          TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,"
          TAGS="${TAGS}badlinkname,tfogo_checklinkname0,with_tailscale"
          go build -tags "$TAGS" \
            -ldflags '-w -s -checklinkname=0' \
            -o /tmp/sui-agent .
          ls -lh /tmp/sui-agent

  arbiter:
    name: 仲裁者（单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: apps/arbiter
      - run: npm run typecheck
        working-directory: apps/arbiter
      - run: npm test
        working-directory: apps/arbiter

  selfhost:
    name: 自托管运行时（类型检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: apps/selfhost
      - name: tsc（同时校验 panel/src，两个运行时共用一份业务代码）
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/selfhost
