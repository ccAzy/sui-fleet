name = "sui-panel"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sui-panel"
database_id = "local-dev-placeholder"

[triggers]
crons = ["*/2 * * * *"]

[vars]
PANEL_BASE = "http://127.0.0.1:8787"

# 前端静态资源（panel/build-frontend.sh 产出）
[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# API / agent / 订阅走 Worker，其余交给静态资源
run_worker_first = ["/api/*", "/agent/*", "/sub/*"]
